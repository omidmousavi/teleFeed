
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نمایش داده‌های JSON</title>
    <style>
        @font-face {
            font-family: Vazir;
            font-style: normal;
            font-weight: normal;
            src: url('./Fonts/Vazir.eot');
            src: url('./Fonts/Vazir.eot') format('embedded-opentype'), 
            url('./Fonts/Vazir.woff2') format('woff2'), 
            url('./Fonts/Vazir.woff') format('woff'), 
            url('./Fonts/Vazir.ttf') format('truetype');
        }
        body { font-family: Vazir, Tahoma, sans-serif; padding: 20px; background: #f4f4f9; }
        .container { max-width: 800px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input { font-family: Vazir; width: 80%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        button { font-family: Vazir; width: 16%; padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .info { display: flex; align-items: center; gap: 15px; margin-top: 20px; border-bottom: 2px solid #eee; padding-bottom: 20px; }
        .avatar { width: 60px; height: 60px; border-radius: 50%; }
        .post { border: 1px solid #000; padding: 15px; margin-top: 15px; border-radius: 5px; background: #f9fcff;}
        .message { line-height: 1.6; }
    </style>
</head>
<body>

<div class="container">
    <input type="text" id="urlInput" placeholder="URL را وارد کنید">
    <button onclick="fetchData()">بارگذاری</button>
    <br>
    <hr>
    <br>
    <div>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/mamlekate.json'">مملکته</button>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/vahidonline.json'">وحیدآنلاین</button>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/jadivarlog.json'">جادی</button>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/ircfspace.json'">ircfspace</button>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/linuxor.json'">linuxor</button>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/toomajsalehi.json'">توماج</button>
        <button onclick="document.getElementById('urlInput').value='https://raw.githubusercontent.com/omidmousavi/teleFeed/refs/heads/export/sohrabcontents.json'">چنل سهراب</button>
    </div>
    <br>
    <hr>
    <br>

    <div id="output"></div>
</div>

<script>
    async function fetchData() {
        const url = document.getElementById('urlInput').value;
        const outputDiv = document.getElementById('output');
        outputDiv.innerHTML = 'در حال بارگذاری...';

        try {
            const response = await fetch(url);
            const data = await response.json();

            let html = `
                <div class="info">
                    <img src="${data.info.photo_url}" class="avatar">
                    <div>
                        <h3>${data.info.title}</h3>
                        <p>@${data.info.username}</p>
                    </div>
                </div>
            `;

            data.posts.forEach(post => {
                html += `
                    <div class="post">
                        <div class="message">${post.message}</div>
                        <small>تاریخ: ${new Date(post.date).toLocaleString('fa-IR')}</small> | 
                        <small>بازدید: ${post.views}</small>
                    </div>
                `;
            });

            outputDiv.innerHTML = html;
        } catch (error) {
            outputDiv.innerHTML = `<p style="color:red">خطا در دریافت داده: ${error.message}</p>`;
        }
    }
</script>

</body>
</html>
